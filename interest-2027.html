<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
      } catch {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>2027 interest</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="booking-config.js"></script>
  <script src="auth-gate.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root, [data-theme="light"] {
      --bg: #f4f5f7; --surface: #ffffff; --surface-alt: #f9fafb;
      --border: #e2e4e9; --text: #1a1d26; --text-secondary: #6b7280;
      --input-bg: #ffffff; --accent: #4f46e5; --accent-hover: #4338ca;
      --danger: #dc2626; --danger-hover: #b91c1c; --success: #16a34a;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }
    [data-theme="dark"] {
      --bg: #111318; --surface: #1a1d24; --surface-alt: #21242c;
      --border: #2e3240; --text: #e4e6eb; --text-secondary: #8b8f9a;
      --input-bg: #21242c; --accent: #6366f1; --accent-hover: #818cf8;
      --danger: #ef4444; --danger-hover: #f87171; --success: #22c55e;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.45; min-height: 100vh;
    }
    .page-sticky {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      padding-top: env(safe-area-inset-top, 0px);
      box-shadow: 0 1px 0 var(--border), 0 6px 14px rgba(0,0,0,.07);
    }
    [data-theme="dark"] .page-sticky {
      box-shadow: 0 1px 0 var(--border), 0 6px 14px rgba(0,0,0,.4);
    }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }
    .topbar-left, .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .topbar h1 { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 36px; padding: 8px 14px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
      text-decoration: none; touch-action: manipulation;
    }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-outline:hover { background: var(--bg); }
    .page { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; }
    .intro { color: var(--text-secondary); font-size: 14px; margin: 0 0 14px; max-width: 62ch; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      margin: 0; padding: 10px 20px 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .toolbar[hidden] { display: none !important; }
    .toolbar label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--text-secondary); }
    select, input[type="text"], textarea {
      font: inherit; font-size: 16px; color: var(--text);
      background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; width: 100%;
    }
    textarea { min-height: 72px; resize: vertical; }
    .count { font-size: 13px; color: var(--text-secondary); padding-bottom: 8px; }
    .table-wrap { overflow: visible; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    th {
      text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--text-secondary); padding: 0; border-bottom: 1px solid var(--border);
      background: var(--surface-alt);
      position: -webkit-sticky;
      position: sticky;
      top: var(--interest-head, 0px);
      z-index: 12;
      box-shadow: 0 1px 0 var(--border);
    }
    .sort-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      width: 100%; margin: 0; padding: 8px 10px; border: 0; background: transparent;
      color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit;
      text-align: left; cursor: pointer; touch-action: manipulation;
    }
    .sort-arrow { display: inline-block; width: 1em; text-align: center; font-size: 10px; }
    .sort-tools { display: none; align-items: flex-end; gap: 8px; }
    .sort-tools .btn { min-width: 44px; padding-left: 10px; padding-right: 10px; }
    td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr.group td {
      background: var(--surface-alt); font-weight: 800; font-size: 13px;
      border-bottom: 1px solid var(--border); padding: 10px;
    }
    .who { font-weight: 800; }
    .muted { color: var(--text-secondary); font-size: 12px; margin-top: 2px; white-space: pre-wrap; }
    .dnc-badge {
      display: inline-flex; align-items: center; margin-left: 6px;
      padding: 2px 7px; border-radius: 999px; background: #dc2626; color: #fff;
      font-size: 10px; font-weight: 800; letter-spacing: .04em; vertical-align: middle;
    }
    tr.person.dnc td:first-child { box-shadow: inset 3px 0 0 #dc2626; }
    .status {
      display: inline-flex; padding: 2px 8px; border-radius: 999px;
      background: var(--surface-alt); border: 1px solid var(--border);
      font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .status.placed { color: var(--success); }
    .status.waiting { color: #b45309; }
    .empty { padding: 28px 16px; text-align: center; color: var(--text-secondary); }
    .blocked { max-width: 520px; margin: 48px auto; padding: 0 16px; color: var(--text-secondary); }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center; padding: 12px;
    }
    .modal-overlay[hidden] { display: none !important; }
    .modal {
      width: min(560px, 100%); max-height: min(92vh, 820px); overflow: auto;
      background: var(--surface); color: var(--text); border-radius: 14px;
      border: 1px solid var(--border); padding: 16px; box-shadow: var(--shadow);
    }
    .modal h2 { font-size: 18px; margin-bottom: 12px; }
    .modal p { margin-bottom: 14px; }
    .grid { display: grid; gap: 10px; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
    .check input { width: 18px; height: 18px; }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .toast {
      position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); background: var(--text); color: var(--bg);
      padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; z-index: 50;
    }
    @media (min-width: 701px) {
      .modal-overlay { align-items: center; }
    }
    @media (max-width: 700px) {
      .topbar, .toolbar { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
      .btn, select { min-height: 44px; }
      .sort-tools { display: flex; }
      .table-wrap { border: 0; background: transparent; overflow: visible; }
      table, tbody { display: block; }
      thead { display: none; }
      tr.group { display: block; margin: 14px 0 6px; }
      tr.group td { display: block; border-radius: 8px; }
      tr.person {
        display: block; margin: 0 0 10px; border: 1px solid var(--border);
        border-radius: 12px; background: var(--surface); padding: 8px 12px 12px;
      }
      tr.person.dnc { border-color: #dc2626; background: #fef2f2; }
      [data-theme="dark"] tr.person.dnc { background: rgba(220, 38, 38, .16); }
      td { display: block; border: 0; padding: 6px 0; }
      td[data-label]::before {
        content: attr(data-label); display: block;
        font-size: 11px; font-weight: 800; letter-spacing: .04em;
        text-transform: uppercase; color: var(--text-secondary);
      }
      td.actions .btn { width: 100%; min-height: 44px; }
      .modal { border-radius: 14px 14px 0 0; max-height: 94vh; }
      .modal-actions .btn { min-height: 44px; flex: 1; }
    }
  </style>
</head>
<body>
  <header class="page-sticky">
    <div class="topbar">
      <div class="topbar-left">
        <a class="btn btn-outline" href="booking-form.html">Back to booking form</a>
        <a class="btn btn-outline" href="admin.html">Admin</a>
        <h1>2027 interest</h1>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-primary" id="addBtn">Add person</button>
      </div>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <label>Status
        <select id="statusFilter">
          <option value="">All</option>
          <option value="interested">Interested</option>
          <option value="waiting for dates">Waiting for dates</option>
          <option value="placed">Placed</option>
        </select>
      </label>
      <p class="count" id="countLine"></p>
      <div class="sort-tools">
        <label>Sort by
          <select id="sortColumn">
            <option value="name">Name</option>
            <option value="contact">Contact</option>
            <option value="when">Preferred when</option>
            <option value="party">Party</option>
            <option value="group">Possible group</option>
            <option value="status">Status</option>
          </select>
        </label>
        <button type="button" class="btn btn-outline" id="sortDir" aria-label="Sorted ascending. Reverse">▲</button>
      </div>
    </div>
  </header>

  <p class="blocked" id="blocked" hidden></p>

  <main class="page" id="app" hidden>
    <p class="intro">People who would like to come in 2027. Use it to build groups of five or six, or to slot a single person into another group. This page is private.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="name" aria-sort="none"><button type="button" class="sort-btn" data-sort="name">Name<span class="sort-arrow" aria-hidden="true"></span></button></th>
            <th data-sort="contact" aria-sort="none"><button type="button" class="sort-btn" data-sort="contact">Contact<span class="sort-arrow" aria-hidden="true"></span></button></th>
            <th data-sort="when" aria-sort="none"><button type="button" class="sort-btn" data-sort="when">Preferred when<span class="sort-arrow" aria-hidden="true"></span></button></th>
            <th data-sort="party" aria-sort="none"><button type="button" class="sort-btn" data-sort="party">Party<span class="sort-arrow" aria-hidden="true"></span></button></th>
            <th data-sort="group" aria-sort="none"><button type="button" class="sort-btn" data-sort="group">Possible group<span class="sort-arrow" aria-hidden="true"></span></button></th>
            <th data-sort="status" aria-sort="none"><button type="button" class="sort-btn" data-sort="status">Status<span class="sort-arrow" aria-hidden="true"></span></button></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </main>

  <div class="modal-overlay" id="editModal" hidden>
    <form class="modal" id="editForm">
      <h2 id="editTitle">Add person</h2>
      <div class="grid">
        <label>Name
          <input type="text" id="fName" required autocomplete="name">
        </label>
        <label>Contact (email or Facebook)
          <input type="text" id="fContact" autocomplete="off">
        </label>
        <label>Source
          <input type="text" id="fSource" autocomplete="off">
        </label>
        <label>Preferred when
          <input type="text" id="fWhen" autocomplete="off">
        </label>
        <label>Party size or companions
          <input type="text" id="fParty" autocomplete="off">
        </label>
        <label>Notes
          <textarea id="fNotes"></textarea>
        </label>
        <label>Status
          <select id="fStatus">
            <option value="interested">Interested</option>
            <option value="waiting for dates">Waiting for dates</option>
            <option value="placed">Placed</option>
          </select>
        </label>
        <label>Possible group
          <input type="text" id="fGroup" list="groupNames" autocomplete="off">
        </label>
        <datalist id="groupNames"></datalist>
        <label class="check"><input type="checkbox" id="fDnc"> Do not contact</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="editDelete" hidden>Delete</button>
        <button type="button" class="btn btn-outline" id="editCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Remove this person?</h2>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="confirmCancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = BOOKING_SUPABASE_URL;
    const SUPABASE_ANON_KEY = BOOKING_SUPABASE_ANON_KEY;
    const sb = AuthGate.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const STATUS_LABEL = {
      interested: 'Interested',
      'waiting for dates': 'Waiting for dates',
      placed: 'Placed'
    };

    let rows = [];
    let editingId = null;
    let pendingDelete = null;

    window.interestStore = {
      async list() {
        const { data, error } = await sb.from('interest_2027').select('*').order('id', { ascending: true });
        if (error) throw error;
        return data || [];
      },
      async save(payload, id) {
        if (id) {
          const { error } = await sb.from('interest_2027').update(payload).eq('id', id);
          if (error) throw error;
          return;
        }
        const { error } = await sb.from('interest_2027').insert(payload);
        if (error) throw error;
      },
      async remove(id) {
        const { error } = await sb.from('interest_2027').delete().eq('id', id);
        if (error) throw error;
      }
    };

    function el(id) { return document.getElementById(id); }

    function pinInterestHead() {
      const head = document.querySelector('.page-sticky');
      if (!head) return;
      document.documentElement.style.setProperty('--interest-head', head.offsetHeight + 'px');
    }

    function watchInterestHead() {
      pinInterestHead();
      const head = document.querySelector('.page-sticky');
      if (head && typeof ResizeObserver === 'function') {
        const watcher = new ResizeObserver(pinInterestHead);
        watcher.observe(head);
      }
      window.addEventListener('resize', pinInterestHead);
    }

    function revealInterest() {
      el('blocked').hidden = true;
      el('app').hidden = false;
      const toolbar = el('toolbar');
      if (toolbar) toolbar.hidden = false;
      pinInterestHead();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function toast(message) {
      const node = document.createElement('div');
      node.className = 'toast';
      node.textContent = message;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 3200);
    }

    function blankToNull(value) {
      const text = String(value ?? '').trim();
      return text ? text : null;
    }

    function statusClass(status) {
      if (status === 'placed') return 'status placed';
      if (status === 'waiting for dates') return 'status waiting';
      return 'status';
    }

    const INTEREST_SORT_KEY = 'interest_2027_sort';
    const INTEREST_SORTS = ['name', 'contact', 'when', 'party', 'group', 'status'];
    function loadInterestSort() {
      try {
        const raw = JSON.parse(localStorage.getItem(INTEREST_SORT_KEY) || '');
        if (raw && INTEREST_SORTS.indexOf(raw.column) >= 0 && (raw.direction === 'asc' || raw.direction === 'desc')) {
          return { column: raw.column, direction: raw.direction };
        }
      } catch (err) { /* keep the original order */ }
      return { column: 'group', direction: 'asc' };
    }

    let interestSort = loadInterestSort();

    function interestDateValue(text) {
      const months = {
        jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3,
        may: 4, jun: 5, june: 5, jul: 6, july: 6, aug: 7, august: 7,
        sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11
      };
      const s = String(text || '');
      let match = s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
      if (match) return Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      match = s.match(/\b(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})\b/);
      if (match) return Date.UTC(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
      match = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]+)\s+(\d{4})\b/);
      if (match && months[match[2].toLowerCase()] != null) {
        return Date.UTC(Number(match[3]), months[match[2].toLowerCase()], Number(match[1]));
      }
      match = s.match(/\b([A-Za-z]+)\s+(\d{4})\b/);
      if (match && months[match[1].toLowerCase()] != null) {
        return Date.UTC(Number(match[2]), months[match[1].toLowerCase()], 1);
      }
      const year = s.match(/\b(20\d{2})\b/);
      match = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]+)\b/);
      if (year && match && months[match[2].toLowerCase()] != null) {
        return Date.UTC(Number(year[1]), months[match[2].toLowerCase()], Number(match[1]));
      }
      return null;
    }

    function interestNumber(text) {
      const s = String(text || '').trim().replace(/,/g, '');
      return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : null;
    }

    function interestSortValue(row, column) {
      const fields = {
        name: row && row.name,
        contact: row && row.contact,
        when: row && row.preferred_when,
        party: row && row.party_size,
        group: row && row.possible_group,
        status: row && row.status
      };
      const text = String(fields[column] == null ? '' : fields[column]).trim();
      if (!text) return { empty: true, kind: 'text', value: '', text: '' };
      if (column === 'when') {
        const date = interestDateValue(text);
        if (date != null) return { empty: false, kind: 'date', value: date, text: text };
      }
      if (column === 'party') {
        const number = interestNumber(text);
        if (number != null) return { empty: false, kind: 'number', value: number, text: text };
      }
      return { empty: false, kind: 'text', value: text, text: text };
    }

    function compareInterestRows(a, b, column, direction) {
      const ka = interestSortValue(a, column);
      const kb = interestSortValue(b, column);
      const idCmp = (Number(a && a.id) || 0) - (Number(b && b.id) || 0);
      if (ka.empty && kb.empty) return idCmp;
      if (ka.empty) return 1;
      if (kb.empty) return -1;
      const rank = { date: 0, number: 1, text: 2 };
      let cmp = rank[ka.kind] - rank[kb.kind];
      if (cmp === 0 && ka.kind === 'text') cmp = ka.text.localeCompare(kb.text, 'en-GB', { sensitivity: 'base' });
      if (cmp === 0 && ka.kind !== 'text') cmp = ka.value < kb.value ? -1 : (ka.value > kb.value ? 1 : 0);
      if (cmp === 0) cmp = ka.text.localeCompare(kb.text, 'en-GB', { sensitivity: 'base' });
      if (cmp === 0) cmp = idCmp;
      return direction === 'desc' ? -cmp : cmp;
    }

    function sortInterestRows(list, column, direction) {
      return (Array.isArray(list) ? list.slice() : []).sort((a, b) => compareInterestRows(a, b, column, direction));
    }

    function filteredRows() {
      const status = el('statusFilter').value;
      return status ? rows.filter(row => row.status === status) : rows.slice();
    }

    function sectionsInOrder(list) {
      const sections = [];
      list.forEach(row => {
        const label = String(row.possible_group || '').trim() || 'No group yet';
        const last = sections[sections.length - 1];
        if (!last || last.label !== label) sections.push({ label: label, people: [row] });
        else last.people.push(row);
      });
      return sections;
    }

    function personCells(row) {
      const dnc = row.do_not_contact
        ? ' <span class="dnc-badge">DO NOT CONTACT</span>'
        : '';
      const notes = row.notes ? '<div class="muted">' + escapeHtml(row.notes) + '</div>' : '';
      const source = row.source ? '<div class="muted">' + escapeHtml(row.source) + '</div>' : '';
      const when = row.preferred_when ? escapeHtml(row.preferred_when) : '—';
      const party = row.party_size ? escapeHtml(row.party_size) : '—';
      const group = String(row.possible_group || '').trim();
      const status = escapeHtml(STATUS_LABEL[row.status] || row.status || '');
      return `
        <td data-label="Name"><div class="who">${escapeHtml(row.name)}${dnc}</div>${notes}</td>
        <td data-label="Contact">${row.contact ? escapeHtml(row.contact) : '—'}${source}</td>
        <td data-label="Preferred when">${when}</td>
        <td data-label="Party">${party}</td>
        <td data-label="Possible group">${group ? escapeHtml(group) : '—'}</td>
        <td data-label="Status"><span class="${statusClass(row.status)}">${status}</span></td>
        <td class="actions" data-label="">
          <button type="button" class="btn btn-outline" data-edit="${Number(row.id)}">Edit</button>
        </td>`;
    }

    function personRow(row) {
      const flag = row.do_not_contact ? ' dnc' : '';
      return `<tr class="person${flag}">${personCells(row)}</tr>`;
    }

    function paintSortControls() {
      const arrow = interestSort.direction === 'asc' ? '▲' : '▼';
      document.querySelectorAll('th[data-sort]').forEach(th => {
        const on = th.getAttribute('data-sort') === interestSort.column;
        th.setAttribute('aria-sort', on ? (interestSort.direction === 'asc' ? 'ascending' : 'descending') : 'none');
        const mark = th.querySelector('.sort-arrow');
        if (mark) mark.textContent = on ? arrow : '';
      });
      const select = el('sortColumn');
      if (select) select.value = interestSort.column;
      const dir = el('sortDir');
      if (dir) {
        dir.textContent = arrow;
        dir.setAttribute('aria-label', interestSort.direction === 'asc' ? 'Sorted ascending. Reverse' : 'Sorted descending. Reverse');
      }
    }

    function chooseInterestSort(column, toggle) {
      if (INTEREST_SORTS.indexOf(column) < 0) return;
      if (toggle && interestSort.column === column) {
        interestSort.direction = interestSort.direction === 'asc' ? 'desc' : 'asc';
      } else if (interestSort.column !== column) {
        interestSort.column = column;
        interestSort.direction = 'asc';
      }
      try { localStorage.setItem(INTEREST_SORT_KEY, JSON.stringify(interestSort)); } catch (err) { /* the list still sorts this visit */ }
      render();
    }

    function render() {
      const list = sortInterestRows(filteredRows(), interestSort.column, interestSort.direction);
      const body = el('listBody');
      const noun = list.length === 1 ? '1 person' : list.length + ' people';
      el('countLine').textContent = noun;
      if (!list.length) {
        body.innerHTML = '<tr><td class="empty" colspan="7">No one matches this status.</td></tr>';
      } else if (interestSort.column === 'group') {
        body.innerHTML = sectionsInOrder(list).map(section => {
          const head = `<tr class="group"><td colspan="7">${escapeHtml(section.label)} · ${section.people.length}</td></tr>`;
          return head + section.people.map(personRow).join('');
        }).join('');
      } else {
        body.innerHTML = list.map(personRow).join('');
      }
      const names = [...new Set(rows.map(row => String(row.possible_group || '').trim()).filter(Boolean))];
      el('groupNames').innerHTML = names.map(name => '<option value="' + escapeHtml(name) + '"></option>').join('');
      paintSortControls();
    }

    function showInterestRows(list) {
      rows = Array.isArray(list) ? list.slice() : [];
      revealInterest();
      render();
    }
    window.showInterestRows = showInterestRows;

    async function loadList() {
      rows = await window.interestStore.list();
      render();
    }

    function openEditor(row) {
      editingId = row && row.id != null ? row.id : null;
      el('editTitle').textContent = editingId ? 'Edit person' : 'Add person';
      el('fName').value = row ? (row.name || '') : '';
      el('fContact').value = row ? (row.contact || '') : '';
      el('fSource').value = row ? (row.source || '') : '';
      el('fWhen').value = row ? (row.preferred_when || '') : '';
      el('fParty').value = row ? (row.party_size || '') : '';
      el('fNotes').value = row ? (row.notes || '') : '';
      el('fStatus').value = row && STATUS_LABEL[row.status] ? row.status : 'interested';
      el('fGroup').value = row ? (row.possible_group || '') : '';
      el('fDnc').checked = !!(row && row.do_not_contact);
      el('editDelete').hidden = !editingId;
      el('editModal').hidden = false;
      el('fName').focus();
    }

    function closeEditor() {
      el('editModal').hidden = true;
      editingId = null;
    }

    function askDelete(row) {
      pendingDelete = row;
      el('confirmText').textContent = 'Remove ' + (row.name || 'this person') + ' from the 2027 interest list? This cannot be undone.';
      el('confirmModal').hidden = false;
    }

    function readPayload() {
      return {
        name: el('fName').value.trim(),
        contact: blankToNull(el('fContact').value),
        source: blankToNull(el('fSource').value),
        preferred_when: blankToNull(el('fWhen').value),
        party_size: blankToNull(el('fParty').value),
        notes: blankToNull(el('fNotes').value),
        status: el('fStatus').value,
        possible_group: blankToNull(el('fGroup').value),
        do_not_contact: el('fDnc').checked
      };
    }

    el('addBtn').addEventListener('click', () => openEditor(null));
    el('editCancel').addEventListener('click', closeEditor);
    el('editDelete').addEventListener('click', () => {
      const row = rows.find(item => String(item.id) === String(editingId));
      if (!row) return;
      closeEditor();
      askDelete(row);
    });
    el('confirmCancel').addEventListener('click', () => {
      pendingDelete = null;
      el('confirmModal').hidden = true;
    });
    el('statusFilter').addEventListener('change', render);
    document.querySelector('thead').addEventListener('click', (event) => {
      const button = event.target.closest('th[data-sort]');
      if (!button) return;
      chooseInterestSort(button.getAttribute('data-sort'), true);
    });
    el('sortColumn').addEventListener('change', () => chooseInterestSort(el('sortColumn').value, false));
    el('sortDir').addEventListener('click', () => chooseInterestSort(interestSort.column, true));
    el('listBody').addEventListener('click', (event) => {
      const button = event.target.closest('[data-edit]');
      if (!button) return;
      const row = rows.find(item => String(item.id) === button.getAttribute('data-edit'));
      if (row) openEditor(row);
    });
    el('editForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = readPayload();
      if (!payload.name) return;
      const id = editingId;
      try {
        await window.interestStore.save(payload, id);
        closeEditor();
        await loadList();
        toast(id ? 'Saved' : 'Person added');
      } catch (err) {
        toast('Save failed. ' + ((err && err.message) || ''));
      }
    });
    el('confirmDelete').addEventListener('click', async () => {
      const row = pendingDelete;
      pendingDelete = null;
      el('confirmModal').hidden = true;
      if (!row) return;
      try {
        await window.interestStore.remove(row.id);
        await loadList();
        toast('Person removed');
      } catch (err) {
        toast('Delete failed. ' + ((err && err.message) || ''));
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (!el('confirmModal').hidden) {
        pendingDelete = null;
        el('confirmModal').hidden = true;
        return;
      }
      if (!el('editModal').hidden) closeEditor();
    });

    document.addEventListener('DOMContentLoaded', async () => {
      watchInterestHead();
      const session = await AuthGate.require(sb, { title: '2027 interest' });
      if (!session) {
        el('blocked').hidden = false;
        el('blocked').textContent = 'Sign in while online with an admin account to open the 2027 interest list.';
        return;
      }
      const { data: allowed, error } = await sb.rpc('is_admin');
      if (error || allowed !== true) {
        window.location.href = 'booking-form.html';
        return;
      }
      revealInterest();
      try {
        await loadList();
      } catch (err) {
        el('listBody').innerHTML = '<tr><td class="empty" colspan="7">The interest list could not be loaded.</td></tr>';
        toast('The interest list could not be loaded.');
      }
    });
  </script>
</body>
</html>
