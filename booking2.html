<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no">
  <title>Jennifer Lindsay — test booking</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="place-categories.js"></script>
  <script src="week-overview.js"></script>
  <script src="phone-layout.js"></script>
  <script src="booking-config.js"></script>
  <script src="auth-gate.js"></script>
  <script src="booking-extras.js"></script>
  <script src="booking2-model.js"></script>
  <script src="planner2-model.js"></script>
  <script src="place-pin.js"></script>
  <script src="place-editor.js"></script>
  <link rel="stylesheet" href="planner2.css">
  <link rel="stylesheet" href="booking2.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <button type="button" id="planSaveStatus" class="plan-save-status" hidden></button>
  <header class="b2-top">
    <p class="b2-back"><a class="b2-back-link" href="booking-form.html">Back to bookings</a></p>
    <p class="b2-kicker">Test booking</p>
    <h1><a class="b2-home" id="b2Home" href="booking-form.html">Back to bookings</a> <span id="b2Title">Jennifer Lindsay</span> <span class="b2-brief" id="b2Brief"></span> <span class="b2-inline-status" id="b2Status"></span><span class="b2-inline-status" id="p2Status"></span></h1>
    <div class="b2-tools">
      <button type="button" class="b2-tool" id="b2Suggest" title="Lay down a draft week from the usual places. You can edit everything after.">Suggest a rough week</button>
      <button type="button" class="b2-tool" id="b2PragueEnds" title="Day one pick-ups from 08:00. Last day drop-off at 18:00.">Prague pick-ups &amp; drop-offs</button>
    </div>
    <button type="button" class="b2-details-toggle" id="b2DetailsToggle" aria-expanded="false" aria-controls="b2Summary">Show details</button>
    <p class="b2-dates" id="b2Dates"></p>
    <p class="b2-note" id="b2Note">Booking details are read-only. The week plan is on this page.</p>
  </header>
  <section id="b2Summary" class="b2-summary" aria-label="Booking summary"></section>
  <div class="p2-bar">
    <button type="button" class="p2-btn" id="p2Places">Places</button>
    <div class="p2-days" id="p2Days" role="tablist" aria-label="Days"></div>
  </div>
  <main class="p2-main b2-plan">
    <aside class="p2-tray" id="p2Tray" aria-label="Places">
      <h2 class="p2-tray-title">Places</h2>
      <input type="search" id="p2Search" class="p2-search" placeholder="Search places" autocomplete="off">
      <div class="p2-types" id="p2Types"></div>
      <div class="p2-groups" id="p2Chips"></div>
    </aside>
    <div class="p2-split" id="p2Split" role="separator" aria-orientation="vertical" aria-label="Resize places and week" tabindex="0"></div>
    <div class="p2-scroll" id="p2Scroll"></div>
  </main>
  <div class="p2-sheet" id="p2Sheet" hidden>
    <div class="p2-sheet-card" role="dialog" aria-labelledby="p2SheetTitle">
      <div class="p2-sheet-head">
        <h2 id="p2SheetTitle">Stop</h2>
        <button type="button" class="p2-btn" id="p2SheetClose">Close</button>
      </div>
      <div id="p2SheetBody"></div>
    </div>
  </div>
  <script src="split-pane.js"></script>
  <script src="prague-exit.js"></script>
  <script src="drag-label.js"></script>
  <script src="rough-week.js"></script>
  <script src="place-popup.js"></script>
  <script src="plan-sync.js"></script>
  <script src="planner2.js" defer></script>
  <script src="booking2.js" defer></script>
</body>
</html>
